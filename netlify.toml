# Statische Seite – kein Build-Schritt
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# www -> ohne www (eine Hauptadresse ist besser für SEO)
[[redirects]]
  from = "https://www.akiistudio.de/*"
  to = "https://akiistudio.de/:splat"
  status = 301
  force = true

# /leistungen hat keine eigene Übersicht – Besucher landen in der Leistungs-Sektion
[[redirects]]
  from = "/leistungen"
  to = "/#leistungen"
  status = 301

[[redirects]]
  from = "/leistungen/"
  to = "/#leistungen"
  status = 301
