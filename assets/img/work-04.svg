<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="w4-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EDE8E0"/>
      <stop offset="50%" stop-color="#DFD8CC"/>
      <stop offset="100%" stop-color="#C7BEAF"/>
    </linearGradient>
    <linearGradient id="w4-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A1C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3A2A1C" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w4-sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="w4-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="w4-g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#w4-bg)"/>
  <polygon points="700,0 1200,0 1200,900 420,900" fill="url(#w4-sheen)" opacity="0.5"/>

  <!-- measured grid: corporate rigour -->
  <g stroke="#8A7C6C" stroke-width="1" opacity="0.22">
    <line x1="150" y1="0" x2="150" y2="900"/><line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="750" y1="0" x2="750" y2="900"/><line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1050" y1="0" x2="1050" y2="900"/>
  </g>

  <!-- ascending bars -->
  <g>
    <rect x="196" y="620" width="76" height="200" fill="url(#w4-col)" opacity="0.55"/>
    <rect x="346" y="540" width="76" height="280" fill="url(#w4-col)" opacity="0.65"/>
    <rect x="496" y="430" width="76" height="390" fill="url(#w4-col)" opacity="0.75"/>
    <rect x="646" y="470" width="76" height="350" fill="url(#w4-col)" opacity="0.7"/>
    <rect x="796" y="300" width="76" height="520" fill="url(#w4-col)" opacity="0.9"/>
    <rect x="946" y="380" width="76" height="440" fill="#C2551F" opacity="0.75"/>
  </g>
  <rect x="0" y="820" width="1200" height="1" fill="#8A7C6C" opacity="0.55"/>
  <ellipse cx="600" cy="838" rx="480" ry="22" fill="#8A7C6C" opacity="0.18" filter="url(#w4-soft)"/>

  <!-- floating tick labels -->
  <g fill="#3A2A1C" opacity="0.35">
    <rect x="150" y="150" width="90" height="7" rx="3"/>
    <rect x="150" y="172" width="54" height="7" rx="3" opacity="0.7"/>
  </g>
  <g stroke="#8A7C6C" stroke-width="1" opacity="0.5">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 10"/>
  </g>
  <rect width="1200" height="900" filter="url(#w4-g)" opacity="0.15" style="mix-blend-mode:multiply"/>
</svg>
